<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">roboframe integration 运行骨架</title>
<desc id="desc">SDK 提供生命周期和执行边界，产品定义数据连接，任务只接收结果反馈。取消任务不关闭持续算法。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#47627d"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18334d}
.title{font-size:32px;font-weight:700}.section{font-size:22px;font-weight:700}.body{font-size:19px}.note{font-size:17px;fill:#52677b}
.box{fill:white;stroke:#7394b0;stroke-width:1.5;rx:12}.line{fill:none;stroke:#47627d;stroke-width:2;marker-end:url(#arrow)}.control{stroke-dasharray:7 5}
</style><rect width="1280" height="900" fill="#f5f8fc"/>
<text x="48" y="61" class="title">roboframe · integration 运行骨架</text>
<text x="48" y="99" class="body">SDK：core 机制 · datatype 类型；产品公开契约随产品维护</text>
<rect x="40" y="135" width="1200" height="185" rx="18" fill="#e5effb"/>
<text x="65" y="174" class="section">01  共用运行骨架 · SDK core</text>

<rect class="box" x="65" y="195" width="350" height="96"/>
<text class="body" text-anchor="middle" x="240.0" y="235.5">Integration</text>
<text class="body" text-anchor="middle" x="240.0" y="262.5">Start / Stop / Reset / Poll</text>
<rect class="box" x="455" y="195" width="350" height="96"/>
<text class="body" text-anchor="middle" x="630.0" y="235.5">运行状态与 generation</text>
<text class="body" text-anchor="middle" x="630.0" y="262.5">IDLE · RUNNING · ERROR</text>
<rect class="box" x="845" y="195" width="365" height="96"/>
<text class="body" text-anchor="middle" x="1027.5" y="235.5">接纳、执行与结果交接</text>
<text class="body" text-anchor="middle" x="1027.5" y="262.5">InputGate · ExecutionChannel</text>
<path class="line control" d="M 1025 320 V 375"/>
<text x="65" y="356" class="note">启停、取消等待、过期结果过滤统一实现；不定义 scan、地图或具体任务。</text>
<rect x="40" y="375" width="1200" height="325" rx="18" fill="#edf4f1"/>
<text x="65" y="415" class="section">02  产品自己的 integration · 示例 demo_robot</text>
<rect class="box" x="65" y="485" width="210" height="96"/>
<text class="body" text-anchor="middle" x="170.0" y="525.5">interface</text>
<text class="body" text-anchor="middle" x="170.0" y="552.5">解码公开契约</text>
<rect class="box" x="320" y="485" width="230" height="96"/>
<text class="body" text-anchor="middle" x="435.0" y="525.5">产品接线</text>
<text class="body" text-anchor="middle" x="435.0" y="552.5">共享 datatype 引用</text>
<rect class="box" x="620" y="447" width="260" height="90"/>
<text class="body" text-anchor="middle" x="750.0" y="484.5">按需异步的组件 / 组</text>
<text class="body" text-anchor="middle" x="750.0" y="511.5">有界队列 → 计算</text>
<rect class="box" x="620" y="576" width="260" height="75"/>
<text class="body" text-anchor="middle" x="750.0" y="619.5">轻量同步组件</text>
<rect class="box" x="950" y="485" width="260" height="96"/>
<text class="body" text-anchor="middle" x="1080.0" y="525.5">完成结果 / 控制 owner</text>
<text class="body" text-anchor="middle" x="1080.0" y="552.5">下游连接或对外发布</text>
<path class="line" d="M 275 533 H 320"/>
<path class="line" d="M 550 513 H 585 V 492 H 620"/>
<path class="line" d="M 550 553 H 585 V 613 H 620"/>
<path class="line" d="M 880 492 H 915 V 513 H 950"/>
<path class="line" d="M 880 613 H 915 V 553 H 950"/>
<text x="65" y="675" class="note">接收入口可并发；计算按需并行；非线程安全组件的多个入口共享一个串行执行上下文。</text>
<rect x="40" y="732" width="1200" height="110" rx="18" fill="#fff1d8"/>
<text x="65" y="769" class="section">03  可选任务 · 当前建图，以后可以接 BT</text>
<text x="65" y="808" class="body">管理任务编号、完成和取消、结果快照；没有任务时，运行仍可以是 RUNNING。</text>
<path class="line control" d="M 1080 581 V 732"/>
<text x="1100" y="720" class="note">任务反馈</text>
<text x="48" y="881" class="body">装配发生在 integration；组件只认识自己的输入输出，不依赖其他组件。</text></svg>